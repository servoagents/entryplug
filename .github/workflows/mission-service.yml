name: Mission service
on: [push, pull_request]
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install test and build tools
        run: python -m pip install -r deps/dev-tools.txt -r deps/test-tools.txt -r deps/build-tools.txt
      - name: Install hash-verified runtime dependencies
        run: python -m pip install --require-hashes -r deps/mission-service.lock
      - run: python -m pip check
      - run: npm ci --prefix ui
      - run: PYTHONPATH=src python scripts/export_contracts.py
      - run: npm --prefix ui run types && git diff --exit-code docs/api ui/src/generated.ts
      - run: npm --prefix ui test
      - run: npm --prefix ui run build
      - run: python -m pytest tests optional_tests/service optional_tests/mcp optional_tests/a2a optional_tests/homeassistant
      - run: python -m build --wheel --no-isolation
      - run: python scripts/check_wheel_assets.py dist/entryplug-0.0.1-py3-none-any.whl
      - name: Install built wheel
        run: |
          python -m pip install --no-deps --force-reinstall dist/entryplug-0.0.1-py3-none-any.whl
          python -m pip check
          python -I -m entryplug --help
      - run: cd ui && npx playwright install --with-deps chromium
      - run: cd ui && ENTRYPLUG_TEST_BROWSER='' npm run test:browser
        env:
          ENTRYPLUG_TEST_PYTHON: python
          ENTRYPLUG_TEST_INSTALLED: '1'
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r deps/test-tools.txt
      - run: python -m pytest tests
      - run: PYTHONPATH=src python -m entryplug --help
  openenv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openenv==0.5.0 -r deps/test-tools.txt
      - run: python -m pytest optional_tests/openenv
