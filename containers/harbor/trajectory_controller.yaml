trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - joint1
      - joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    action_monitor_rate: 20.0
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.02
      joint1:
        trajectory: 0.1
        goal: 0.03
      joint2:
        trajectory: 0.1
        goal: 0.03
