[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entryplug"
version = "0.0.1"
description = "Agent first physical capability runtime"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Javier Blanco-Romero"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/fj-blanco/entryplug"

[project.scripts]
entryplug = "entryplug.cli:main"

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]
openenv = ["openenv==0.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/entryplug/deps" = ["deps/compatibility.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["entryplug"]
